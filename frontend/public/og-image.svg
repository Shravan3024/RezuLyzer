<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid Accent -->
  <circle cx="950" cy="315" r="280" fill="#2563EB" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="200" cy="150" r="180" fill="#4F46E5" fill-opacity="0.15" filter="blur(50px)"/>

  <!-- Brand Pill -->
  <rect x="100" y="100" width="160" height="38" rx="19" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="180" y="124" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">AI-POWERED ATS</text>

  <!-- Title -->
  <text x="100" y="210" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="64" font-weight="800">
    Resu<tspan fill="#3B82F6">Lyzer</tspan>
  </text>
  
  <text x="100" y="270" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="28" font-weight="600">
    Understand Your Resume. Improve Your Opportunities.
  </text>

  <text x="100" y="325" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
    Evaluate your resume against any job description with real-time NLP matching,
  </text>
  <text x="100" y="355" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
    transparent ATS compatibility scoring, and actionable skill gap recommendations.
  </text>

  <!-- Feature Tags -->
  <rect x="100" y="420" width="220" height="48" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="210" y="450" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">✓ Real NLP Scoring</text>

  <rect x="340" y="420" width="220" height="48" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="450" y="450" fill="#34D399" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">✓ Skill Gap Detection</text>

  <rect x="580" y="420" width="240" height="48" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="700" y="450" fill="#F472B6" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">✓ Instant PDF Audit</text>

  <!-- URL Tag -->
  <text x="100" y="540" fill="#64748B" font-family="system-ui, sans-serif" font-size="18" font-weight="500">
    Free to use  •  Private &amp; Secure Document Processing
  </text>
</svg>
