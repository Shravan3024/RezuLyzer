    <!-- Structured Data (Schema.org JSON-LD): WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ResuLyzer",
      "url": "https://rezulyzer.onrender.com",
      "description": "Free AI-powered resume analyzer and ATS compatibility platform with real-time NLP matching, skill gap detection, and actionable resume optimization advice.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-Time NLP Resume Parsing (PDF & DOCX)",
        "Multi-Factor ATS Compatibility Scoring",
        "Required vs Preferred Skill Gap Detection",
        "Semantic Similarity & Keyword Density Analysis",
        "Multi-Role Resume Comparison Matrix",
        "Downloadable Professional PDF Audit Reports"
      ]
    }
    </script>

    <!-- Structured Data (Schema.org JSON-LD): FAQPage for Rich Search Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is an ATS Compatibility Score and how does ResuLyzer calculate it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ResuLyzer calculates your ATS compatibility score using a multi-factor mathematical formula: 35% Required Skills Match, 25% Semantic Vector Similarity, 15% Keyword Relevance, 10% Experience Alignment, 10% Education Relevance, and 5% Resume Structure."
          }
        },
        {
          "@type": "Question",
          "name": "Does ResuLyzer support both PDF and DOCX resumes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ResuLyzer extracts text and structure from both PDF files (via PyMuPDF) and Microsoft Word documents (.docx) with binary header verification."
          }
        },
        {
          "@type": "Question",
          "name": "Can I compare my resume across multiple jobs at once?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ResuLyzer includes a Multi-Role Comparison matrix where you upload your resume once and view your compatibility ranking across different career paths and job postings side-by-side."
          }
        },
        {
          "@type": "Question",
          "name": "Are my uploaded resumes stored privately and securely?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. ResuLyzer enforces strict document privacy: your files are processed securely, are never sold or shared with third parties, and are never used for public model training."
          }
        }
      ]
    }
    </script>
  </head>
