version: '3.8'

services:
  # PostgreSQL Database for persistent relational storage
  db:
    image: postgres:15-alpine
    container_name: resulyzer-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resulyzer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resulyzer_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-resulyzer_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resulyzer_user} -d ${POSTGRES_DB:-resulyzer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching & rate limiting
  redis:
    image: redis:7-alpine
    container_name: resulyzer-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resulyzer-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-resulyzer_user}:${POSTGRES_PASSWORD:-resulyzer_secure_password}@db:5432/${POSTGRES_DB:-resulyzer_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-resulyzer-production-secret-key-change-in-prod-xyz987}
      - ENVIRONMENT=production
      - DEBUG=False
      - ENABLE_TRANSFORMERS=True
      - CORS_ORIGINS=["http://localhost", "http://localhost:3000", "http://localhost:80", "http://127.0.0.1"]
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage

  # Vite + React + Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resulyzer-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  backend_storage:

